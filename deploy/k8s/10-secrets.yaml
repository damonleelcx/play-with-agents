# Credentials never appear in a manifest, a command line or an SSM payload.
# They live in AWS Secrets Manager and are synced by the External Secrets
# Operator already running on this node, using the node's IAM role
# (inline policy PlaySecretsRead, scoped to play/*).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: play
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: play
  namespace: play
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: play, creationPolicy: Owner }
  data:
    - secretKey: PLAY_DATABASE_URL
      remoteRef: { key: play/prod, property: PLAY_DATABASE_URL }
    - secretKey: PLAY_LLM_API_KEY
      remoteRef: { key: play/prod, property: PLAY_LLM_API_KEY }
    # Cover art (DashScope wan text-to-image). The code treats it as
    # optional (procedural covers without it), but this entry is not: the
    # property must exist in play/prod or the whole ExternalSecret fails.
    - secretKey: PLAY_IMAGE_API_KEY
      remoteRef: { key: play/prod, property: PLAY_IMAGE_API_KEY }
---
# The mail relay login — the same platform login forge sends with (heros/platform),
# so no new mailbox has to be minted on the relay. A separate ExternalSecret on purpose: a data entry
# whose remote property is missing fails the WHOLE ExternalSecret, and mail
# must not be able to take the database credential down with it. The pods
# reference the target Secret as optional — without it mail is off (logged as
# MAIL_DISABLED), everything else runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: play-mail
  namespace: play
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: play-mail, creationPolicy: Owner }
  data:
    - secretKey: PLAY_SMTP_USERNAME
      remoteRef: { key: heros/platform, property: smtp-username }
    - secretKey: PLAY_SMTP_PASSWORD
      remoteRef: { key: heros/platform, property: smtp-password }
---
# Aoi's voice: the estate's shared Fish Audio key (the one jobs and forge
# speak with). Its own ExternalSecret for the same reason as mail: a missing
# property must not take the database credential down, and the pods mount it
# as optional — without it the voice is simply off (logged VOICE_DISABLED).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: play-voice
  namespace: play
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: play-voice, creationPolicy: Owner }
  data:
    - secretKey: PLAY_TTS_API_KEY
      remoteRef: { key: opportunity-bridge/model, property: OBA_TTS_API_KEY }
