apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: redirect-https, namespace: act }
spec:
  redirectScheme: { scheme: https, permanent: true }
---
# Rate limit at the edge bounds request floods. It is generous on purpose: behind
# k3s's service load balancer the source address may be the node's, so this
# bucket can be SHARED by every visitor, and one page load is ~15 requests.
# Spending is bounded elsewhere — per-endpoint limits in the app (chat 30/min,
# sign-in 10/min per client IP) and the per-account/per-deployment daily caps.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: rate-limit, namespace: act }
spec:
  rateLimit:
    average: 600
    burst: 300
    period: 1m
    sourceCriterion: { ipStrategy: { depth: 0 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: act
  namespace: act
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: act-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: act.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: act-web, port: { number: 80 } } }
  tls:
    - hosts: [act.heros-agent.space]
      secretName: act-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: act-http-redirect
  namespace: act
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: act-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: act.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: act-web, port: { number: 80 } } }
